name: Security checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate isolated local configuration
        run: |
          python python/configure_dev.py
          python - <<'PY'
          from pathlib import Path
          import secrets
          values = {key: secrets.token_hex(24) for key in ('MYSQL_ROOT_PASSWORD', 'MYSQL_APP_PASSWORD', 'DEMO_PASSWORD')}
          values['SEED_DEMO'] = 'true'
          Path('.env').write_text(''.join(f'{k}={v}\n' for k,v in values.items()))
          PY
      - name: Start fresh Compose with automatic migrations and demo
        run: docker compose up --build --wait --wait-timeout 180
      - name: Verify demo, migrations and least privilege
        run: |
          docker compose exec -T api python - <<'PY'
          import pymysql
          from app.core.config import settings
          conn = pymysql.connect(host=settings.DB_HOST, user=settings.DB_USER, password=settings.DB_PASSWORD, database=settings.DB_NAME)
          with conn.cursor() as cur:
              cur.execute('SELECT COUNT(*) FROM Schema_Migrations')
              assert cur.fetchone()[0] == 5
              cur.execute("SELECT COUNT(*) FROM Usuarios WHERE Email LIKE '%@demo.talentix.com' AND EmailConfirmadoEm IS NOT NULL")
              assert cur.fetchone()[0] == 3
              cur.execute('SHOW GRANTS FOR CURRENT_USER')
              grants = ' '.join(row[0] for row in cur.fetchall()).upper()
              assert 'CREATE' not in grants and 'ALL PRIVILEGES' not in grants and 'GRANT OPTION' not in grants
              try:
                  cur.execute('CREATE TABLE Must_Not_Exist(id INT)')
              except pymysql.err.OperationalError as error:
                  assert error.args[0] == 1142
              else:
                  raise AssertionError('Runtime received DDL privileges')
          conn.close()
          PY
          python - <<'PY'
          import urllib.request, urllib.error
          for path in ('python/.env', '.env', '.git/config', 'sql/talentix_db.sql'):
              try:
                  urllib.request.urlopen('http://127.0.0.1:5500/'+path)
              except urllib.error.HTTPError as error:
                  assert error.code == 404
              else:
                  raise AssertionError('Private file served: '+path)
          PY
      - name: Log in with all demo roles through the real API
        run: |
          python - <<'PYTHON'
          import json, urllib.request
          from pathlib import Path
          env = dict(line.split('=',1) for line in Path('.env').read_text().splitlines())
          for role, expected in [('candidato','candidato'), ('empresa','empresa'), ('admin','administrador')]:
              body = json.dumps({'email':role+'@demo.talentix.com','senha':env['DEMO_PASSWORD']}).encode()
              req = urllib.request.Request('http://127.0.0.1:8000/auth/login', data=body, headers={'Content-Type':'application/json','Origin':'http://127.0.0.1:5500'})
              with urllib.request.urlopen(req) as response:
                  assert response.status == 200
                  assert json.load(response)['tipo_usuario'] == expected
          PYTHON
      - name: Repeat bootstrap without duplicating demo accounts
        run: |
          docker compose run --rm bootstrap
          docker compose exec -T api python - <<'PY'
          import pymysql
          from app.core.config import settings
          conn = pymysql.connect(host=settings.DB_HOST, user=settings.DB_USER, password=settings.DB_PASSWORD, database=settings.DB_NAME)
          with conn.cursor() as cur:
              cur.execute("SELECT COUNT(*) FROM Usuarios WHERE Email LIKE '%@demo.talentix.com'")
              assert cur.fetchone()[0] == 3
          conn.close()
          PY
      - name: Save Compose logs
        if: always()
        run: mkdir -p test-results && docker compose logs --no-color > test-results/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-bootstrap-results
          path: test-results
      - name: Stop isolated containers
        if: always()
        run: docker compose down --volumes

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            python/requirements.txt
            python/requirements-dev.txt
      - name: Reject tracked secrets, uploads and Python caches
        run: |
          python - <<'PY'
          from pathlib import PurePosixPath
          import subprocess
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          rejected = []
          for file in filter(None, files):
              path = PurePosixPath(file)
              secret = path.name == '.env' or (path.name.startswith('.env.') and path.name != '.env.example')
              cache = '__pycache__' in path.parts or path.suffix in ('.pyc', '.pyo')
              upload = file.startswith('python/uploads/') and path.name != '.gitkeep'
              if secret or cache or upload:
                  rejected.append(file)
          if rejected:
              raise SystemExit('Arquivos privados/gerados versionados: ' + ', '.join(rejected))
          PY
      - name: Install test dependencies
        run: python -m pip install -r python/requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q python/app python/*.py
      - name: Run security regression tests
        working-directory: python
        run: python -m pytest tests -q

  mysql-and-browser:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: talentix-ci-root-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: talentix_test
          MYSQL_USER: talentix_test
          MYSQL_PASSWORD: talentix-ci-app-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptalentix-ci-root-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      TALENTIX_ISOLATED_TESTS: '1'
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: talentix_test
      DB_USER: talentix_test
      DB_PASSWORD: talentix-ci-app-only
      TEST_ROOT_PASSWORD: talentix-ci-root-only
      SECRET_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
      IA_WORKER_TOKEN: '2222222222222222222222222222222222222222222222222222222222222222'
      PAYMENT_WEBHOOK_TOKEN: '3333333333333333333333333333333333333333333333333333333333333333'
      SMTP_ENABLED: 'false'
      SESSION_COOKIE_SECURE: 'false'
      FRONTEND_ORIGIN: http://127.0.0.1:5500
      FRONTEND_RESET_URL: http://127.0.0.1:5500/html/login.html
      UPLOAD_DIR: /tmp/talentix-ci-uploads
      MAX_UPLOAD_SIZE_MB: '1'
      TEST_RESULTS_DIR: ${{ github.workspace }}/test-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            python/requirements.txt
            python/requirements-ia.txt
            python/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-tests/package-lock.json
      - name: Install Python and browser test dependencies
        run: |
          python -m pip install -r python/requirements-dev.txt
          npm ci --prefix web-tests --ignore-scripts
          cd web-tests
          npx playwright install --with-deps chromium
      - name: Prepare isolated MySQL and start API
        working-directory: python
        run: |
          python tests/mysql/prepare_ci.py
          mkdir -p "$TEST_RESULTS_DIR"
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$TEST_RESULTS_DIR/api.log" 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for attempt in range(40):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/saude', timeout=2)
                  break
              except Exception:
                  time.sleep(0.5)
          else:
              raise SystemExit('API não iniciou.')
          PY
      - name: Exercise every API operation and security rule on MySQL
        working-directory: python
        run: |
          python tests/mysql/run_scenarios.py
          python tests/mysql/run_regressions.py
          python tests/mysql/run_november.py
      - name: Start frontend
        run: python -m http.server 5500 --bind 127.0.0.1 > "$TEST_RESULTS_DIR/frontend.log" 2>&1 &
      - name: Validate diagram, accessibility, files and complete browser flow
        run: |
          npm run check --prefix web-tests
          npm test --prefix web-tests
      - name: Audit dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r python/requirements-dev.txt
          npm audit --prefix web-tests --audit-level=low
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: talentix-test-results
          path: test-results
