<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Administração — Talentix</title><link rel="stylesheet" href="../css/painel.css"></head>
<body data-painel="administrador"><div class="app"><aside class="sidebar"><a href="index.html" class="sidebar__brand">Talentix</a><nav class="sidebar__nav" aria-label="Painel"><button type="button" class="nav-item active" data-tab="metricas">Visão geral</button><button type="button" class="nav-item " data-tab="empresas">Empresas</button><button type="button" class="nav-item " data-tab="denuncias">Denúncias</button><button type="button" class="nav-item " data-tab="catalogo">Catálogo</button><button type="button" class="nav-item " data-tab="contatos">Contato</button><button type="button" class="nav-item " data-tab="notificacoes">Notificações</button><button type="button" class="nav-item " data-tab="mensagens">Mensagens</button></nav><div class="sidebar__footer"><div class="user-chip"><div class="user-chip__avatar" id="userAvatar">–</div><div><div class="user-chip__name" id="userName">Carregando…</div><div class="user-chip__role">Administração</div></div></div><button class="btn-logout" id="btnLogout" type="button">Sair</button></div></aside><main class="content"><div class="toast" id="toast" role="status" aria-live="polite"></div><section class="tab-panel active" id="tab-metricas"><header class="content__header"><h1>Visão geral</h1></header><div class="metric-grid" id="metricasAdmin"></div></section>
<section class="tab-panel" id="tab-empresas"><header class="content__header"><h1>Empresas</h1></header><div class="list" id="empresasAdmin"></div></section>
<section class="tab-panel" id="tab-denuncias"><header class="content__header"><h1>Denúncias</h1></header><div class="list" id="denunciasAdmin"></div></section>
<section class="tab-panel" id="tab-catalogo"><header class="content__header"><h1>Catálogo de cursos e idiomas</h1></header><div class="card"><form id="formCursoAdmin"><input type="hidden" id="cursoId"><div class="field"><label for="cursoTitulo">Título do curso</label><input id="cursoTitulo" required maxlength="200"></div><div class="field"><label for="cursoDescricao">Descrição do curso</label><textarea id="cursoDescricao" rows="3"></textarea></div><div class="grid-2"><div class="field"><label for="cursoPlataforma">Plataforma</label><input id="cursoPlataforma" maxlength="100"></div><div class="field"><label for="cursoCategoria">Categoria</label><input id="cursoCategoria" maxlength="100"></div></div><div class="field"><label for="cursoUrl">Link do curso</label><input id="cursoUrl" type="url" maxlength="500"></div><button class="btn btn-primary" type="submit">Salvar curso</button><button class="btn btn-secondary" id="limparCurso" type="button">Novo curso</button></form></div><div class="list" id="cursosAdmin"></div><div class="card"><form id="formIdiomaAdmin"><div class="field"><label for="idiomaNome">Novo idioma</label><input id="idiomaNome" required maxlength="100"></div><button class="btn btn-primary" type="submit">Adicionar idioma</button></form><div id="idiomasAdmin"></div></div></section>
<section class="tab-panel" id="tab-contatos"><header class="content__header"><h1>Mensagens de contato</h1></header><div class="list" id="contatosAdmin"></div></section><section class="tab-panel" id="tab-notificacoes"><header class="content__header"><h1>Notificações</h1></header><div class="list" id="listaNotificacoes"></div></section>
<section class="tab-panel" id="tab-mensagens"><header class="content__header"><h1>Mensagens</h1></header><div class="list" id="listaMensagens"></div></section></main></div><dialog id="modalMensagem"><div class="dialog-header"><h2>Conversa</h2><button type="button" id="fecharMensagem" aria-label="Fechar conversa">×</button></div><div id="conversa"></div><form id="formMensagem"><input type="hidden" id="msgDestinatario"><input type="hidden" id="msgContexto"><div class="field"><label for="msgConteudo">Sua mensagem</label><textarea id="msgConteudo" required minlength="1" maxlength="10000" rows="4"></textarea></div><button class="btn btn-primary" type="submit">Enviar mensagem</button></form></dialog><script src="../js/config.js"></script><script src="../js/painel-comum.js"></script><script src="../js/dashboard-admin.js"></script></body></html>
