<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha conta — Talentix</title>
    <link rel="stylesheet" href="../css/painel.css?v=20261005-2">
    <link rel="stylesheet" href="../css/acessibilidade.css?v=20261005-2">
  </head>

  <body data-painel="usuario">
    <div class="app">
      <aside class="sidebar">
        <a href="index.html" class="sidebar__brand">Talentix</a>
        <nav class="sidebar__nav" aria-label="Painel">
          <button type="button" class="nav-item active" data-tab="conta">Minha conta</button>
        </nav>
        <div class="sidebar__footer">
          <div class="user-chip">
            <div class="user-chip__avatar" id="userAvatar">–</div>
            <div>
              <div class="user-chip__name" id="userName">Carregando…</div>
              <div class="user-chip__role">Minha conta</div>
            </div>
          </div>
          <button class="btn-logout" id="btnLogout" type="button">Sair</button>
          <button class="btn-switch-mode" id="btnModoAdmin" type="button" hidden>Voltar à administração</button>
        </div>
      </aside>
      <main class="content">
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <section class="tab-panel active" id="tab-conta">
          <header class="content__header">
            <h1>Aguardando vínculo</h1>
          </header>
          <div class="card">
            <p>Compartilhe seu ID com o responsável pela empresa para ele adicionar você à equipe de recrutamento.</p>
            <code class="account-id" id="idConta"></code>
            <button class="btn btn-primary" id="atualizarVinculo" type="button">Verificar vínculo</button>
          </div>
        </section>
      </main>
    </div>
    <script src="../js/config.js?v=20261005-2"></script><script src="../js/painel-comum.js?v=20261005-2"></script><script src="../js/dashboard-conta.js?v=20261005-2"></script><script src="../js/seguranca-conta.js?v=20261005-2"></script> <script src="../js/acessibilidade.js?v=20261005-2"></script>
  </body>
</html>
